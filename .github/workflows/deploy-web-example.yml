name: Deploy Web Example

on:
  push:
    branches: [develop]
    paths:
      - "flutter_secure_storage/example/**"
      - "flutter_secure_storage/lib/**"
      - "flutter_secure_storage_platform_interface/**"
      - "flutter_secure_storage_web/**"
      - ".github/workflows/deploy-web-example.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: github.repository == 'juliansteenbakker/flutter_secure_storage'
    name: Build Web Example
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Workspace Dependencies
        run: flutter pub get

      - name: Build Web Example
        working-directory: flutter_secure_storage/example
        run: flutter build web --release --base-href /flutter_secure_storage/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: flutter_secure_storage/example/build/web

  deploy:
    if: github.repository == 'juliansteenbakker/flutter_secure_storage'
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
